[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/eval",
  "crates/store",
  "crates/providers",
  "crates/app",
  "apps/server",
  "apps/social",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# sqlx 0.9.0 declares rust-version = 1.94.0; anything lower cannot build the workspace.
rust-version = "1.94"

[workspace.dependencies]
agentos-domain = { path = "crates/domain" }
agentos-store = { path = "crates/store" }
agentos-providers = { path = "crates/providers" }
agentos-app = { path = "crates/app" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# Ed25519 signing. Default features only: "zeroize" is one of them, and the
# "rand_core" feature is deliberately NOT enabled — it wants rand_core 0.6 while
# the workspace is on rand 0.9, and seeding from `rand::rng()` avoids carrying
# two copies of rand_core for one 32-byte fill.
ed25519-dalek = "2"
hmac = "0.12"
rand = "0.9"
# PBKDF2 pour les mots de passe des comptes de console. Déjà dans le graphe de
# compilation — rustls le tire par `sqlx/tls-rustls-ring` — donc cette ligne
# n'ajoute rien à la lock file. L'argument complet (pourquoi pas `argon2`,
# pourquoi surtout pas un PBKDF2 écrit à la main sur `hmac`) est en tête de
# `apps/server/src/routes/accounts.rs`.
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
# CDP is JSON-RPC over a websocket, and Browserbase launches Chrome for us, so a
# websocket client is all we need — chromiumoxide would bring a whole browser
# model we never drive.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
# Text extraction from a PDF, and deliberately *only* that: no rasteriser, no
# layout engine, no font renderer. Pure Rust, MIT, and it carries the ToUnicode
# / CFF / Type1 / CID encoding work that a hand-rolled content-stream scanner
# gets wrong quietly. `crates/app/src/knowledge.rs` argues the choice and what
# was weighed against it.
pdf-extract = "0.12"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"

sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros",
] }
pgvector = { version = "0.4", features = ["sqlx"] }

rmcp = { version = "3.1.4", default-features = false, features = [
  "client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "client-side-sse",
] }
a2a-lf = "0.3"
a2a-server-lf = "0.4"

# dev
proptest = "1"
trybuild = "1"

[profile.dev]
# The workspace is test-heavy and the dependency tree is large; without this a
# `cargo test` cycle spends most of its time in codegen for crates we never step through.
opt-level = 0
debug = 1
