services:
  postgres:
    # pg18 + pgvector >= 0.8.6: 0.8.3-0.8.6 fixed HNSW vacuum index corruption
    # and IVFFlat buffer overflows present in the 0.8.0-0.8.2 era images.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentos
    # ponytail: host ports offset to 54xx so this stack never collides with the
    # other Postgres containers already running on this machine.
    ports: ["5442:5432"]
    # pg18+ wants the mount at /var/lib/postgresql, NOT .../data — the image
    # refuses to start on the old path. See docker-library/postgres#1259.
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
