[package]
name = "agentos-domain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Deliberately has NO tokio, NO sqlx, NO reqwest, NO async-trait.
# The absence of those dependencies is what enforces that business rules
# cannot reach the network or the database. Do not add I/O deps here.
[dependencies]
# Pure encoding, no I/O: a JWK's `x` and `kid` members are base64url text.
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
trybuild.workspace = true
