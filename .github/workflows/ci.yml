name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentos

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agentos"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # One database per package, serialised inside a package. See scripts/test.sh
      # for why a plain `cargo test --workspace` is flaky against a real Postgres.
      - run: ./scripts/test.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
